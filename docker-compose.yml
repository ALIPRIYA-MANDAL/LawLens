services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lawlens-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lawlens-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
